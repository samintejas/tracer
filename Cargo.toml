[workspace]
resolver = "3"
members = ["crates/api", "crates/core"]
# the Leptos frontend is a wasm crate with its own workspace and lockfile
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
