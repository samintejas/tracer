[package]
name = "pebblelab"
description = "pebblelab/fin: a household money tracker. One binary: REST server, MCP server (HTTP and stdio) and a CLI."
version.workspace = true
edition.workspace = true

[[bin]]
name = "pebblelab"
path = "src/main.rs"

[dependencies]
pebblelab-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "fs", "set-header", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.11"
serde_urlencoded = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
